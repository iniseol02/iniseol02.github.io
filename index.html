<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INISEOL GACHA · 캡슐 열기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Lora:ital,wght@1,600;1,700&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{--b:#3D6FD6;--b2:#6E98E8;--b3:#A9C5F3;--b4:#D6E4FB;--ink:#2F4E8F;--soft:#6C86BD;
  --dream:linear-gradient(135deg,#FFD6F0,#D9C8FF 40%,#B9DAFF 75%,#FFF3C4);--sapphire:#2F57B3;--blue:#5B8DEF;--sky:#9CC3F5;--clear:#C9D9F2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(170deg,#EEF3FC 0%,#DCE7FA 45%,#BFD4F6 100%) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.55) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.55) 1.5px,transparent 1.5px);
  background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 80% 40% at 50% 0%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 40% at 50% 0%,#000 30%,transparent 80%)}
.scal{height:26px;background:radial-gradient(circle at 50% 0,#fff 14px,transparent 15px) repeat-x;background-size:32px 26px}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px 50px;position:relative}
.deco{position:absolute;pointer-events:none}
header{text-align:center;padding:10px 0 4px}
.chip{display:inline-block;background:var(--b);color:#fff;font-family:Poppins,sans-serif;font-weight:700;font-size:11px;letter-spacing:2.5px;padding:5px 16px;border-radius:20px}
.logo{font-family:Lora,serif;font-style:italic;font-weight:700;font-size:58px;line-height:1.05;color:var(--b);transform:skewX(-8deg);text-shadow:0 0 18px #fff;margin-top:6px}
.sub{font-family:Lora,serif;font-style:italic;color:var(--b2);font-size:18px}
.win{margin-top:16px;border-radius:24px;background:rgba(255,255,255,.35);border:4px solid #fff;outline:2px solid rgba(61,111,214,.45);outline-offset:2px;box-shadow:0 16px 40px rgba(61,111,214,.18);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;background:linear-gradient(90deg,#8DB0F0,#3D6FD6);color:#fff;font-family:Poppins,sans-serif;font-weight:600;font-size:15px}
.bar .t{flex:1}.bar i{width:24px;height:24px;border:2px solid #fff;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:13px}
.in{padding:18px 16px 22px}
.card{background:rgba(255,255,255,.8);border:2px solid var(--b4);border-radius:26px;padding:16px;margin-bottom:14px}
.h{font-family:Jua,sans-serif;font-size:18px;color:var(--b);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.h small{font-family:'Gowun Dodum';font-size:12px;color:var(--soft);margin-left:auto}
textarea{width:100%;font:inherit;font-family:Poppins,monospace;font-size:14px;color:var(--ink);padding:12px 14px;border-radius:16px;border:2px solid var(--b4);background:#fff;outline:none;resize:none;height:76px;word-break:break-all}
textarea:focus{border-color:var(--b2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;font-family:Jua,sans-serif;font-size:17px;border-radius:999px;padding:12px 20px;color:#fff;background:linear-gradient(180deg,#6E98E8,#3D6FD6);box-shadow:0 6px 0 #2D57B0,0 10px 20px rgba(61,111,214,.3);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #2D57B0}
.btn.big{width:100%;font-size:22px;padding:16px;margin-top:12px}
.btn.ghost{background:#fff;color:var(--b);box-shadow:0 0 0 2px var(--b3) inset}
.btn[disabled]{opacity:.45}
.muted{color:var(--soft);font-size:13px}.note{font-size:13px;color:var(--soft);line-height:1.7}
.err{color:#C2456B;font-size:14px;margin-top:8px;min-height:1em}
.stage{text-align:center;display:none;padding:6px 0}
.machine{width:190px;height:280px}
.machine.shake{animation:shake .45s ease-in-out 3}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.knob{transform-origin:85px 196px}.machine.shake .knob{animation:spin 1.35s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.tap{font-family:Jua,sans-serif;color:var(--b);font-size:18px;margin-top:6px}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:12px 8px;margin-top:6px}
.cap{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:translateY(-30px) scale(.6)}
.cap.in{animation:drop .5s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes drop{to{opacity:1;transform:none}}
.ball{width:54px;height:54px;border-radius:50%;position:relative;border:3px solid #fff;box-shadow:0 6px 14px rgba(61,111,214,.25);
  background:linear-gradient(180deg,rgba(255,255,255,.9) 0 47%,#fff 47% 53%,var(--c) 53% 100%)}
.ball:after{content:"";position:absolute;left:9px;top:7px;width:16px;height:8px;border-radius:50%;background:#fff;transform:rotate(-30deg)}
.g-dream .ball{background:linear-gradient(180deg,rgba(255,255,255,.9) 0 47%,#fff 47% 53%,transparent 53%),var(--dream);box-shadow:0 0 0 3px #FFE58A,0 0 22px #FFD6F0}
.g-sapphire{--c:var(--sapphire)}.g-blue{--c:var(--blue)}.g-sky{--c:var(--sky)}.g-clear{--c:var(--clear)}
.cap em{font-style:normal;font-family:Poppins,sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;color:var(--soft)}
.g-dream em{color:#C26AB5}
.cap .sg{font-family:Poppins,sans-serif;font-weight:700;font-size:10px;color:#fff;background:var(--b2);border-radius:8px;padding:0 6px;margin-top:-2px}
.cap .sg.z{background:none;color:transparent}
.tabs{display:flex;background:rgba(255,255,255,.75);border-bottom:2px solid var(--b4)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font-family:Jua,sans-serif;font-size:16px;color:var(--soft);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--b);border-bottom-color:var(--b)}
.pane{display:none}.pane.on{display:block}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk button{border:2px solid var(--b4);background:#fff;border-radius:20px;padding:12px 6px;cursor:pointer;font:inherit;color:var(--ink)}
.pk button b{display:block;font-family:Jua,sans-serif;font-size:19px;color:var(--b)}
.pk button span{font-size:13px;color:var(--soft)}
.pk button.on{border-color:var(--b);background:linear-gradient(180deg,#fff,#E6EFFD);box-shadow:0 0 0 3px rgba(61,111,214,.15)}
.amt{display:flex;justify-content:space-between;align-items:baseline;background:#F2F6FE;border-radius:18px;padding:14px 16px;margin-top:12px}
.amt b{font-family:Poppins,sans-serif;font-size:26px;color:var(--b)}
.pay{display:grid;gap:10px;margin-top:12px}
.pay .btn{width:100%}
.acct{background:#fff;border:2px dashed var(--b3);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.7}
.acct b{font-family:Poppins,sans-serif}
input.t{width:100%;font:inherit;font-size:16px;color:var(--ink);padding:12px 14px;border-radius:16px;border:2px solid var(--b4);background:#fff;outline:none;margin-bottom:8px}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin:10px 0;font-size:15px;line-height:1.6}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--b);color:#fff;font-family:Poppins;font-weight:700;font-size:13px;display:grid;place-items:center}
.soon{background:#FFF6E8;border:2px solid #F7DDB0;color:#8A5A12;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6}
.rk{list-style:none}
.rk li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px dashed var(--b4);font-size:15px}
.rk li:last-child{border-bottom:0}
.rk .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:Poppins;font-weight:700;font-size:13px;background:#F2F6FE;color:var(--b);flex:none}
.rk li:nth-child(1) .no{background:linear-gradient(135deg,#FFE58A,#FFD6F0);color:#8A5A12}
.rk li:nth-child(2) .no{background:linear-gradient(135deg,#E6EEF9,#C9D9F2)}
.rk li:nth-child(3) .no{background:linear-gradient(135deg,#F7DDB0,#F3E8FF)}
.rk .nm{flex:1;font-family:Jua,sans-serif;word-break:break-all}
.rk .ct{font-family:Poppins;font-size:12px;color:var(--soft)}
.rk li.me{background:linear-gradient(90deg,#E3EDFF,transparent);border-radius:14px}
.ex{display:flex;justify-content:space-between;align-items:center;background:#F2F6FE;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:15px}
.ex b{font-family:Poppins;color:var(--b);font-size:18px}
.rhead{display:flex;justify-content:space-between;align-items:baseline}
.rno{font-family:Poppins,sans-serif;font-weight:700;color:var(--b)}
.list{list-style:none;margin-top:8px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--b4);font-size:15px}
.list li:last-child{border-bottom:0}.list li b{font-family:Poppins,sans-serif}
.tag{display:inline-block;font-family:Poppins,sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;border-radius:10px;padding:2px 8px;color:#fff;background:var(--c,#6E98E8);margin-right:6px;vertical-align:1px}
.tag.g-dream{background:var(--dream);color:#7A4A90}.tag.g-clear{color:#5F7DB8}
.sec{border-top:2px dashed var(--b4);margin-top:14px;padding-top:14px}
.stamps{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.stamps span{width:20px;height:20px;border-radius:50%;border:2px solid var(--b3);background:#fff}
.stamps span.f{background:radial-gradient(circle at 35% 30%,#fff 0 18%,transparent 20%),linear-gradient(135deg,#8DB0F0,#3D6FD6);border-color:#fff;box-shadow:0 0 0 1.5px var(--b2)}
.banner{border-radius:18px;padding:12px 14px;margin-top:10px;font-family:Jua,sans-serif;font-size:16px;line-height:1.5}
.banner.ceil{background:linear-gradient(90deg,#E3EDFF,#F3E8FF);color:var(--b)}.banner.dream{background:var(--dream);color:#7A4A90}
.after{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 4px;border-bottom:2px dashed var(--b4)}
details summary{cursor:pointer;font-family:Jua,sans-serif;color:var(--b);font-size:16px}
footer{text-align:center;color:var(--soft);font-size:12px;margin-top:18px;line-height:1.7}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="scal"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#CFE0FB" stop-opacity=".85"/><stop offset="1" stop-color="#7EA6EC" stop-opacity=".9"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EA4EC"/><stop offset="1" stop-color="#3D6FD6"/></linearGradient>
  <radialGradient id="globe" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#DCE8FC" stop-opacity=".6"/><stop offset="1" stop-color="#9DBBF2" stop-opacity=".75"/></radialGradient>
  <clipPath id="gc"><circle cx="85" cy="82" r="66"/></clipPath>
  <symbol id="heart" viewBox="0 0 200 180"><path d="M100 168C40 128 8 92 8 54 8 24 32 8 56 8c20 0 36 12 44 28 8-16 24-28 44-28 24 0 48 16 48 46 0 38-32 74-92 114Z" fill="url(#gl)" stroke="#fff" stroke-width="4"/><ellipse cx="54" cy="44" rx="20" ry="10" transform="rotate(-30 54 44)" fill="#fff"/></symbol>
  <symbol id="star" viewBox="0 0 220 220"><path d="M110 22l26 64 68 4-53 43 17 67-58-38-58 38 17-67-53-43 68-4Z" fill="url(#gl)" stroke="url(#gl)" stroke-width="26" stroke-linejoin="round"/><ellipse cx="92" cy="78" rx="18" ry="8" transform="rotate(-25 92 78)" fill="#fff"/></symbol>
</defs></svg>

<div class="wrap">
  <svg class="deco" style="left:-34px;top:20px;transform:rotate(-14deg)" width="110" height="99"><use href="#heart"/></svg>
  <svg class="deco" style="right:-26px;top:40px;transform:rotate(16deg)" width="96" height="96"><use href="#star"/></svg>
  <header>
    <span class="chip">FIVEM SKIN SHOP</span>
    <div class="logo">INISEOL</div>
    <div class="sub">open your capsule</div>
  </header>

  <div class="win">
    <div class="bar"><span class="t">♡ open_capsule.exe</span><i>–</i><i>□</i><i>×</i></div>
    <div class="tabs"><button class="on" data-tab="open">캡슐 열기</button><button data-tab="my">마이페이지</button><button data-tab="rank">랭킹</button></div>
    <div class="in">
     <section class="pane on" id="pane-open">
      <div class="card" id="entry">
        <div class="h">🎫 캡슐 코드 입력</div>
        <div class="note" style="margin-bottom:10px">입금 확인 후 받은 코드를 붙여넣고 캡슐을 열어 보세요.</div>
        <textarea id="code" placeholder="INI-로 시작하는 코드를 붙여넣어 주세요" autocomplete="off" spellcheck="false"></textarea>
        <div class="err" id="err"></div>
        <button class="btn big" id="open">캡슐 열기</button>
      </div>

<div id="result"></div>
     </section>
     <section class="pane" id="pane-my">
      <div id="mybox"></div>
      <div class="card">
        <div class="h">🫧 마이페이지 코드 <small>최신 보관함으로 바꾸기</small></div>
        <textarea id="mycode" placeholder="운영진에게 받은 마이페이지 코드나 캡슐 코드를 붙여넣어 주세요" autocomplete="off" spellcheck="false"></textarea>
        <div class="err" id="myerr"></div>
        <button class="btn" style="width:100%" id="myload">보관함 불러오기</button>
      </div>
     </section>
     <section class="pane" id="pane-rank"><div id="rankbox"></div></section>

    </div>
  </div>
  <footer>결과는 입금 확인 시점에 보안 난수로 정해지고, 코드에 담겨 있어요.<br>상품 · 스탬프 보관함은 운영진에게 문의해 주세요 ♡</footer>
</div>
<div class="scal" style="transform:scaleY(-1)"></div>
<div class="confetti" id="conf"></div>

<script>
const ITEMS={complete:'완전체 개인스킨 교환권',outfit:'의상 1개 추가권',hair:'헤어 1개 추가권',option:'옵션 선택권 (문신 추가 / 색상 추가 중 택1)',color_change:'색상 변경권'};
const GRADES=[
 {key:'dream',c:'d',tag:'DREAM',w:5,item:'complete'},
 {key:'sapphire',c:'s',tag:'SAPPHIRE',w:40,item:'outfit'},
 {key:'blue',c:'b',tag:'BLUE',w:150,item:'hair'},
 {key:'sky',c:'k',tag:'SKY',w:300,item:'option'},
 {key:'clear',c:'c',tag:'CLEAR',w:505,item:'color_change'}];
const BYC=Object.fromEntries(GRADES.map(g=>[g.c,g])), G=Object.fromEntries(GRADES.map(g=>[g.key,g]));
const PKL={'1':'1회','8':'5+3회','16':'10+6회'};
const PKP={'1':30000,'8':150000,'16':300000};
const CEIL=15;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}
function b64dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function ftime(sec){const d=new Date(sec*1000);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}

function decode(raw){
  const code=raw.replace(/\s+/g,'');
  if(!/^INI-[A-Za-z0-9_-]+$/.test(code)) throw new Error('코드 형식이 달라요. INI-로 시작하는 코드를 전부 붙여넣어 주세요.');
  let txt; try{ txt=b64dec(code.slice(4)); }catch(e){ throw new Error('코드를 읽지 못했어요. 빠진 글자가 없는지 확인해 주세요.'); }
  const cut=txt.lastIndexOf('|'); const body=txt.slice(0,cut), sum=txt.slice(cut+1);
  if(cut<0 || fnv(body)!==sum) throw new Error('코드가 올바르지 않아요. 받은 코드를 다시 복사해 주세요.');
  if(body[0]==='{'){
    let o; try{ o=JSON.parse(body); }catch(e){ throw new Error('코드가 올바르지 않아요.'); }
    const out={my:o.m||null, rec:null};
    if(o.p){ const p=o.p; const results=[...p.r].map(c=>{ if(!BYC[c]) throw new Error('코드가 올바르지 않아요.'); return BYC[c].key; });
      out.rec={no:p.no,pkg:p.pk,label:PKL[p.pk]||p.pk,results,gains:p.g?[...p.g].map(Number):null,before:p.b,after:p.a,first:!!p.f,ceiling:p.c,ts:p.t,name:p.n}; }
    return out;
  }
  const f=body.split('|'); if(f[0]!=='1') throw new Error('지원하지 않는 코드예요.');
  const [ ,no,pkg,res,gains,before,after,first,ceiling,ts,...nm]=f;
  const results=[...res].map(c=>{ if(!BYC[c]) throw new Error('코드가 올바르지 않아요.'); return BYC[c].key; });
  return {my:null, rec:{no:+no,pkg,label:PKL[pkg]||pkg,results,gains:gains?[...gains].map(Number):null,before:+before,after:+after,first:first==='1',ceiling:+ceiling,ts:parseInt(ts,36),name:nm.join('|')}};
}

$('#open').onclick=async()=>{
  $('#err').textContent='';
  let d; try{ d=decode($('#code').value); }catch(e){ $('#err').textContent=e.message; return; }
  if(d.my) saveMy(d.my);
  if(!d.rec){ showTab('my'); renderMy(); return; }
  $('#open').disabled=true;
  try{ await play(d.rec, !!d.my); } finally { $('#open').disabled=false; }
};

async function play(rec, hasMy){
  $('#result').innerHTML='';
  const cnt={}; rec.results.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  const dots=Array.from({length:CEIL},(_,i)=>`<span class="${i<rec.after?'f':''}"></span>`).join('');
  $('#result').innerHTML=`<div class="card">
    <div class="rhead"><div class="h" style="margin:0">🎐 ${esc(rec.name)} 님의 캡슐</div><span class="rno">#${rec.no}</span></div>
    <div class="muted">${rec.label} · ${ftime(rec.ts)} 입금 확인</div>
    <div class="caps">${rec.results.map((k,i)=>{const sg=rec.gains?rec.gains[i]:null;return `<div class="cap g-${k}"><div class="ball"></div><em>${G[k].tag}</em>${sg===null?'':`<span class="sg${sg?'':' z'}">${sg?'★+'+sg:'·'}</span>`}</div>`;}).join('')}</div>
    <div class="after">
      <ul class="list">${GRADES.filter(g=>cnt[g.key]).map(g=>`<li><span><span class="tag g-${g.key}" style="--c:var(--${g.key})">${g.tag}</span>${ITEMS[g.item]}</span><b>×${cnt[g.key]}</b></li>`).join('')}</ul>
      ${cnt.dream?'<div class="banner dream">✨ DREAM 당첨! 완전체 개인스킨 교환권을 축하드려요!</div>':''}
      <div class="sec"><div class="h" style="margin-bottom:2px">스탬프 <small>${rec.first?'첫 뽑기 보너스 +1 포함':''}</small></div>
        <div class="stamps">${dots}</div><div class="muted">${rec.after}/${CEIL}${rec.gains?` · 이번에 +${rec.gains.reduce((a,b)=>a+b,0)}개`:''}</div>
        ${rec.ceiling?`<div class="banner ceil">🎉 스탬프 ${CEIL}개 달성! 완전체 개인스킨 교환권 × ${rec.ceiling} 지급</div>`:''}</div>
      <div class="note sec">상품은 운영진이 보관함에 넣어 두었어요. 사용하실 때는 주문티켓에서 말씀해 주세요.<br>상품 유효기간 6개월 · 스탬프는 소멸되지 않아요.</div>
      ${hasMy?'<div style="margin-top:14px;text-align:center"><button class="btn" id="gomy">마이페이지 보기</button></div>':''}
    </div></div>`;
  $('#result .after').style.display='block';
  document.querySelectorAll('#result .cap').forEach((el,i)=>{ el.style.animationDelay=(i*40)+'ms'; el.classList.add('in'); });
  if(cnt.dream||rec.ceiling) confetti();
  const gm=$('#gomy'); if(gm) gm.onclick=()=>{ showTab('my'); renderMy(); window.scrollTo({top:0,behavior:'smooth'}); };
}
function confetti(){ const c=$('#conf'); const cols=['#FFD6F0','#D9C8FF','#B9DAFF','#FFF3C4','#6E98E8'];
  for(let i=0;i<70;i++){ const e=document.createElement('i'); e.style.left=Math.random()*100+'vw'; e.style.background=cols[i%5]; e.style.animationDelay=Math.random()*0.8+'s'; c.appendChild(e); }
  setTimeout(()=>c.innerHTML='',3800); }

function flash(msg){ let t=$('#flash'); if(!t){ t=document.createElement('div'); t.id='flash'; t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#3D6FD6;color:#fff;font-family:Jua,sans-serif;padding:12px 20px;border-radius:999px;z-index:60;transition:.25s;max-width:90vw;text-align:center'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity=1; clearTimeout(flash._t); flash._t=setTimeout(()=>t.style.opacity=0,2200); }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='my') renderMy(); if(b.dataset.tab==='rank') renderRank();
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+b.dataset.tab));
});
function showTab(name){ document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===name));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+name)); }
const ITEM_BY = {C:'complete',O:'outfit',H:'hair',P:'option',X:'color_change'};
const MYKEY='iniseol_my_v2';
let myMem=null;
function saveMy(m){ myMem=m; try{ localStorage.setItem(MYKEY, JSON.stringify(m)); }catch(e){} }
function loadMy(){ if(myMem) return myMem; try{ const v=localStorage.getItem(MYKEY); if(v) myMem=JSON.parse(v); }catch(e){} return myMem; }
function renderMy(){
  const m=loadMy(), box=$('#mybox');
  if(!m){ box.innerHTML='<div class="card"><div class="h">🫧 마이페이지</div><div class="note">아직 불러온 보관함이 없어요. 캡슐 코드로 캡슐을 열거나, 운영진에게 받은 마이페이지 코드를 아래에 붙여넣어 주세요.</div></div>'; return; }
  const dots=Array.from({length:CEIL},(_,i)=>`<span class="${i<m.s?'f':''}"></span>`).join('');
  const items=Object.keys(ITEM_BY).filter(c=>m.i&&m.i[c]).map(c=>`<li><span>${ITEMS[ITEM_BY[c]]}</span><b>×${m.i[c]}</b></li>`).join('');
  box.innerHTML=`<div class="card">
    <div class="h">🫧 ${esc(m.n)} 님의 보관함 <small>${ftime(m.t)} 기준</small></div>
    <div class="h" style="font-size:16px;margin:6px 0 0">스탬프 <small>${m.s}/${CEIL}</small></div>
    <div class="stamps">${dots}</div>
    <div class="muted">스탬프 ${CEIL}개를 모으면 완전체 개인스킨 교환권 확정 · 스탬프는 소멸되지 않아요</div>
    <div class="sec"><div class="h" style="font-size:16px">보유 아이템</div>
      <ul class="list">${items||'<li><span class="muted">보유한 아이템이 없어요</span></li>'}</ul>
      <div class="ex"><span>🔄 교환 가능<br><span class="muted">색상 변경권 3장 → 옵션 선택권 1장</span></span><b style="white-space:nowrap">${m.x||0}회</b></div>
      <div class="note" style="margin-top:8px">아이템 사용 · 교환은 디스코드 주문티켓에서 요청해 주세요.</div></div>
  </div>
`;
  renderRank();
}
function renderRank(){
  const m=loadMy(), box=$('#rankbox');
  if(!m){ box.innerHTML='<div class="card"><div class="h">👑 전체 랭킹</div><div class="note">캡슐 코드로 캡슐을 열거나 마이페이지 코드를 불러오면 랭킹을 볼 수 있어요.</div></div>'; return; }
  const rk=(m.rk||[]).map((r,i)=>`<li class="${i+1===m.k?'me':''}"><span class="no">${i+1}</span><span class="nm">${esc(r[0])}${i+1===m.k?' <span class="ct">(나)</span>':''}</span><span class="ct">캡슐 ${r[1]}개</span></li>`).join('');
  box.innerHTML=`<div class="card"><div class="h">👑 전체 랭킹 <small>뽑은 캡슐 수 기준 · ${ftime(m.t)}</small></div>
    <ul class="rk">${rk||'<li class="muted">아직 랭킹이 없어요</li>'}</ul>
    ${m.k>10?`<div class="ex"><span>내 순위</span><b>${m.k}위</b></div>`:''}
    <div class="note" style="margin-top:10px">TOP 10까지 보여요. 최신 랭킹은 새 코드를 받으면 바뀌어요.</div></div>`;
}
$('#myload').onclick=()=>{
  $('#myerr').textContent='';
  let d; try{ d=decode($('#mycode').value); }catch(e){ $('#myerr').textContent=e.message; return; }
  if(!d.my){ $('#myerr').textContent='이 코드에는 보관함 정보가 없어요. 운영진에게 마이페이지 코드를 요청해 주세요.'; return; }
  saveMy(d.my); $('#mycode').value=''; renderMy(); window.scrollTo({top:0,behavior:'smooth'});
};
function routeHash(){ if(location.hash==='#open') showTab('open'); if(location.hash==='#my'){ showTab('my'); } if(location.hash==='#rank'){ showTab('rank'); renderRank(); } }
renderMy(); renderRank();
window.addEventListener('hashchange',routeHash); routeHash();

</script>
</body>
</html>
